<svg width="1520" height="492" viewBox="0 0 1520 492" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1520" height="492" fill="#F4F4F5"/>
  
  <!-- Title -->
  <text x="760" y="60" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#18181B" text-anchor="middle">評価項目 作成ガイド</text>
  
  <!-- Step 1 Box -->
  <rect x="30" y="90" width="470" height="300" rx="12" fill="white" stroke="#E4E4E7" stroke-width="2"/>
  
  <!-- Step 1 Header -->
  <g>
    <rect x="45" y="108" width="20" height="20" fill="none" stroke="#71717A" stroke-width="2"/>
    <line x1="50" y1="118" x2="60" y2="118" stroke="#71717A" stroke-width="2"/>
    <line x1="50" y1="123" x2="60" y2="123" stroke="#71717A" stroke-width="2"/>
    <line x1="50" y1="128" x2="60" y2="128" stroke="#71717A" stroke-width="2"/>
    <text x="75" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#18181B">カスタムチェックリスト</text>
    <text x="45" y="160" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#52525B">大項目/中項目</text>
  </g>
  
  <!-- Plus button -->
  <circle cx="245" cy="170" r="18" fill="white" stroke="#EF4444" stroke-width="3"/>
  <line x1="245" y1="162" x2="245" y2="178" stroke="#EF4444" stroke-width="3"/>
  <line x1="237" y1="170" x2="253" y2="170" stroke="#EF4444" stroke-width="3"/>
  
  <!-- Category tree -->
  <text x="75" y="205" font-family="Arial, sans-serif" font-size="13" fill="#71717A">大項目</text>
  <text x="65" y="235" font-family="Arial, sans-serif" font-size="13" fill="#18181B">▼ 1. 反社リスク</text>
  <text x="75" y="265" font-family="Arial, sans-serif" font-size="13" fill="#71717A">中項目</text>
  <text x="75" y="295" font-family="Arial, sans-serif" font-size="12" fill="#52525B">1.1. 決算・財務報告プロセスに関する規</text>
  <text x="75" y="310" font-family="Arial, sans-serif" font-size="12" fill="#52525B">程・マニュアルの整備</text>
  <text x="65" y="340" font-family="Arial, sans-serif" font-size="13" fill="#18181B">▼ 2. 決算・財務報告プロセスに関する規</text>
  <text x="75" y="355" font-family="Arial, sans-serif" font-size="12" fill="#52525B">程・マニュアルの整備</text>
  
  <!-- Speech bubble 1 -->
  <ellipse cx="395" cy="125" rx="90" ry="35" fill="white" stroke="#18181B" stroke-width="2"/>
  <text x="395" y="120" font-family="Arial, sans-serif" font-size="11" fill="#18181B" text-anchor="middle">社内フォーマットに沿って</text>
  <text x="395" y="135" font-family="Arial, sans-serif" font-size="11" fill="#18181B" text-anchor="middle">ツリー構造を準備！</text>
  <circle cx="330" cy="145" r="4" fill="white" stroke="#18181B" stroke-width="2"/>
  <circle cx="315" cy="155" r="3" fill="white" stroke="#18181B" stroke-width="2"/>
  
  <!-- Step 1 Label -->
  <text x="250" y="420" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#18181B" text-anchor="middle">STEP 1: カテゴリ（大・中）作成</text>
  
  <!-- Arrow 1 -->
  <path d="M 515 240 L 555 240" stroke="#71717A" stroke-width="3" fill="none"/>
  <path d="M 545 230 L 555 240 L 545 250" stroke="#71717A" stroke-width="3" fill="none"/>
  
  <!-- Step 2 Box -->
  <rect x="565" y="90" width="470" height="300" rx="12" fill="white" stroke="#E4E4E7" stroke-width="2"/>
  
  <!-- Step 2 Header -->
  <g>
    <rect x="580" y="108" width="20" height="20" fill="none" stroke="#71717A" stroke-width="2"/>
    <line x1="585" y1="118" x2="595" y2="118" stroke="#71717A" stroke-width="2"/>
    <line x1="585" y1="123" x2="595" y2="123" stroke="#71717A" stroke-width="2"/>
    <line x1="585" y1="128" x2="595" y2="128" stroke="#71717A" stroke-width="2"/>
    <text x="610" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#18181B">カスタムチェックリスト</text>
    <text x="580" y="160" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#52525B">大項目/中項目</text>
  </g>
  
  <!-- Plus button 2 -->
  <circle cx="780" cy="170" r="18" fill="white" stroke="#EF4444" stroke-width="3"/>
  <line x1="780" y1="162" x2="780" y2="178" stroke="#EF4444" stroke-width="3"/>
  <line x1="772" y1="170" x2="788" y2="170" stroke="#EF4444" stroke-width="3"/>
  
  <!-- New button -->
  <rect x="700" y="200" width="110" height="40" rx="6" fill="#DC2626"/>
  <text x="755" y="217" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">＋</text>
  <text x="755" y="232" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">新規作成</text>
  
  <!-- Category tree 2 -->
  <text x="610" y="275" font-family="Arial, sans-serif" font-size="13" fill="#71717A">大項目</text>
  <text x="600" y="305" font-family="Arial, sans-serif" font-size="13" fill="#18181B">▼ 1. 反社リスク</text>
  <text x="610" y="335" font-family="Arial, sans-serif" font-size="13" fill="#71717A">中項目</text>
  <text x="610" y="360" font-family="Arial, sans-serif" font-size="12" fill="#52525B">1.1. 決算・財務報告プロセスに関する規</text>
  
  <!-- Speech bubble 2 -->
  <ellipse cx="920" cy="125" rx="95" ry="35" fill="white" stroke="#18181B" stroke-width="2"/>
  <text x="920" y="120" font-family="Arial, sans-serif" font-size="11" fill="#18181B" text-anchor="middle">カテゴリごとに具体的な</text>
  <text x="920" y="135" font-family="Arial, sans-serif" font-size="11" fill="#18181B" text-anchor="middle">チェック項目を追加！</text>
  <circle cx="855" cy="145" r="4" fill="white" stroke="#18181B" stroke-width="2"/>
  <circle cx="840" cy="155" r="3" fill="white" stroke="#18181B" stroke-width="2"/>
  
  <!-- Step 2 Label -->
  <text x="800" y="420" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#18181B" text-anchor="middle">STEP 2: 評価項目作成</text>
  
  <!-- Arrow 2 -->
  <path d="M 1050 240 L 1090 240" stroke="#71717A" stroke-width="3" fill="none"/>
  <path d="M 1080 230 L 1090 240 L 1080 250" stroke="#71717A" stroke-width="3" fill="none"/>
  
  <!-- Step 3 Box -->
  <rect x="1100" y="90" width="390" height="300" rx="12" fill="white" stroke="#E4E4E7" stroke-width="2"/>
  
  <!-- Settings panel -->
  <rect x="1120" y="108" width="220" height="90" rx="6" fill="#F4F4F5"/>
  <text x="1135" y="128" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#18181B">設定</text>
  <rect x="1135" y="145" width="180" height="18" rx="3" fill="#E4E4E7"/>
  <rect x="1135" y="170" width="180" height="18" rx="3" fill="#E4E4E7"/>
  
  <!-- Form fields -->
  <rect x="1255" y="175" width="215" height="190" rx="8" fill="white" stroke="#EF4444" stroke-width="3"/>
  <text x="1270" y="198" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#18181B">回答形式</text>
  <rect x="1270" y="208" width="180" height="26" rx="4" fill="#F4F4F5"/>
  <circle cx="1385" cy="221" r="5" fill="white" stroke="#71717A" stroke-width="1"/>
  
  <text x="1270" y="250" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#18181B">統制内容</text>
  <rect x="1270" y="260" width="180" height="26" rx="4" fill="#F4F4F5"/>
  
  <text x="1270" y="302" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#18181B">補足情報</text>
  <rect x="1270" y="312" width="180" height="26" rx="4" fill="#F4F4F5"/>
  
  <rect x="1270" y="345" width="12" height="12" rx="2" fill="#3B82F6"/>
  <path d="M 1272 351 L 1275 354 L 1280 348" stroke="white" stroke-width="2" fill="none"/>
  <text x="1288" y="355" font-family="Arial, sans-serif" font-size="11" fill="#18181B">証憑添付</text>
  <circle cx="1339" cy="351" r="6" fill="white" stroke="#71717A" stroke-width="1"/>
  <text x="1344" y="355" font-family="Arial, sans-serif" font-size="9" fill="#71717A">?</text>
  
  <!-- Speech bubble 3 -->
  <ellipse cx="1400" cy="125" rx="85" ry="35" fill="white" stroke="#18181B" stroke-width="2"/>
  <text x="1400" y="120" font-family="Arial, sans-serif" font-size="11" fill="#18181B" text-anchor="middle">先に回答の型や</text>
  <text x="1400" y="135" font-family="Arial, sans-serif" font-size="11" fill="#18181B" text-anchor="middle">判断基準を定義！</text>
  <circle cx="1345" cy="145" r="4" fill="white" stroke="#18181B" stroke-width="2"/>
  <circle cx="1330" cy="155" r="3" fill="white" stroke="#18181B" stroke-width="2"/>
  
  <!-- Step 3 Label -->
  <text x="1295" y="420" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#18181B" text-anchor="middle">STEP 3: フォーム・統制内容の構築</text>
  
  <!-- Bottom text -->
  <text x="760" y="472" font-family="Arial, sans-serif" font-size="14" fill="#18181B" text-anchor="middle">この順番で作成することで、効果的で統一されたチェックリストが完成します。</text>
</svg>
